<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Sent Successfully</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark shadow">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">

                <i class="bi bi-mortarboard-fill"></i>

                Smart Classroom Attendance System

            </span>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow-lg text-center p-5"
             style="max-width: 550px; width: 100%;">

            <!-- Success Icon -->

            <div class="mb-3">

                <i class="bi bi-check-circle-fill text-success"
                   style="font-size: 80px;">
                </i>

            </div>


            <!-- Heading -->

            <h2 class="fw-bold">

                Email Sent Successfully!

            </h2>


            <!-- Message -->

            <p class="text-muted mt-3">

                The attendance notification has been successfully
                sent to the student's parent/guardian.

            </p>


            <!-- Success Message -->

            <div class="alert alert-success mt-4">

                <i class="bi bi-envelope-check-fill"></i>

                Parent notification sent successfully.

            </div>


            <!-- Buttons -->

            <div class="mt-4">

                <a href="{{ url_for('attendance_alerts') }}"
                   class="btn btn-primary px-4">

                    <i class="bi bi-bell-fill"></i>

                    Back to Attendance Alerts

                </a>


                <a href="{{ url_for('dashboard') }}"
                   class="btn btn-secondary px-4 ms-2">

                    <i class="bi bi-speedometer2"></i>

                    Dashboard

                </a>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer class="text-center p-3">

        © 2026 Smart Classroom Attendance System

        <br>

        Developed by Raha

    </footer>


</body>

</html>
