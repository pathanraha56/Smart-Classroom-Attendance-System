<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-primary shadow">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">

                <i class="bi bi-mortarboard-fill"></i>

                Smart Classroom Attendance System

            </span>

            <a
                href="{{ url_for('view_students') }}"
                class="btn btn-light">

                <i class="bi bi-arrow-left"></i>

                Back to Students

            </a>

        </div>

    </nav>


    <!-- ================= EDIT STUDENT ================= -->

    <div class="container mt-5 mb-5">

        <div
            class="card shadow mx-auto"
            style="max-width: 700px;">

            <div class="card-body p-5">

                <!-- PAGE TITLE -->

                <div class="text-center mb-4">

                    <i
                        class="bi bi-person-circle text-primary"
                        style="font-size: 70px;">
                    </i>

                    <h2 class="mt-3 fw-bold">
                        Edit Student Details
                    </h2>

                    <p class="text-muted">
                        Update the student's information below.
                    </p>

                </div>


                <!-- ================= FORM ================= -->

                <form
                    action="{{ url_for('edit_student', id=student[0]) }}"
                    method="POST">


                    <!-- STUDENT NAME -->

                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label fw-bold">

                            <i class="bi bi-person-fill"></i>

                            Student Name

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person"></i>

                            </span>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                class="form-control"
                                value="{{ student[1] }}"
                                placeholder="Enter student name"
                                required>

                        </div>

                    </div>


                    <!-- ROLL NUMBER -->

                    <div class="mb-3">

                        <label
                            for="roll_number"
                            class="form-label fw-bold">

                            <i class="bi bi-card-text"></i>

                            Roll Number

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-hash"></i>

                            </span>

                            <input
                                type="text"
                                id="roll_number"
                                name="roll_number"
                                class="form-control"
                                value="{{ student[2] }}"
                                placeholder="Enter roll number"
                                required>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label fw-bold">

                            <i class="bi bi-envelope-fill"></i>

                            Email

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-envelope"></i>

                            </span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                value="{{ student[3] or '' }}"
                                placeholder="Enter email address">

                        </div>

                    </div>


                    <!-- PHONE -->

                    <div class="mb-3">

                        <label
                            for="phone"
                            class="form-label fw-bold">

                            <i class="bi bi-telephone-fill"></i>

                            Phone Number

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-telephone"></i>

                            </span>

                            <input
                                type="text"
                                id="phone"
                                name="phone"
                                class="form-control"
                                value="{{ student[4] or '' }}"
                                placeholder="Enter parent/student phone number">

                        </div>

                    </div>


                    <!-- ================= BUTTONS ================= -->

                    <div class="text-center mt-4">

                        <button
                            type="submit"
                            class="btn btn-success px-4">

                            <i class="bi bi-check-circle"></i>

                            Update Student

                        </button>


                        <a
                            href="{{ url_for('view_students') }}"
                            class="btn btn-secondary px-4 ms-2">

                            <i class="bi bi-x-circle"></i>

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-primary text-white text-center p-3">

        © 2026 Smart Classroom Attendance System

        <br>

        Developed by Raha

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
